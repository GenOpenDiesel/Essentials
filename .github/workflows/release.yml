name: Build custom EssentialsX release

on:
  push:
    paths:
      - "Essentials/src/**"
      - "EssentialsSpawn/src/**"
      - "nms/**/src/**"
      - "pom.xml"
      - "Essentials/pom.xml"
      - "EssentialsSpawn/pom.xml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build EssentialsX and EssentialsSpawn
        run: mvn -B -pl Essentials,EssentialsSpawn -am package -DskipTests

      - name: Prepare artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          essentials_jar="$(find Essentials/target -maxdepth 1 -type f -name 'EssentialsX-*.jar' ! -name 'original-*' | head -n 1)"
          spawn_jar="$(find EssentialsSpawn/target -maxdepth 1 -type f -name 'EssentialsXSpawn-*.jar' ! -name 'original-*' | head -n 1)"
          short_sha="${GITHUB_SHA::7}"
          tag="custom-${GITHUB_RUN_NUMBER}-${short_sha}"
          cp "$essentials_jar" "dist/EssentialsX-2.17.1-heal-feed-custom-${short_sha}.jar"
          cp "$spawn_jar" "dist/EssentialsXSpawn-2.17.1-heal-feed-custom-${short_sha}.jar"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.jar \
            --title "Custom EssentialsX $RELEASE_TAG" \
            --notes "Automated release for commit $GITHUB_SHA. Includes EssentialsX, EssentialsXSpawn, and separate hardcoded 600-second /heal and /feed cooldowns." \
            --latest
